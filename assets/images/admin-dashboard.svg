<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">March Mandalar Admin Dashboard</title>
  <desc id="desc">A stylized admin dashboard preview with statistics, users and songs.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1db954"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs>
  <rect width="900" height="560" rx="36" fill="#07101d"/>
  <rect x="30" y="30" width="840" height="500" rx="25" fill="#0d1828" stroke="#263449"/>
  <rect x="30" y="30" width="190" height="500" rx="25" fill="url(#g)" opacity=".95"/>
  <circle cx="92" cy="92" r="28" fill="#fff" opacity=".95"/><text x="132" y="101" fill="#fff" font-family="Arial" font-size="22" font-weight="700">ADMIN</text>
  <g fill="#fff" opacity=".88" font-family="Arial" font-size="18"><text x="65" y="175">Dashboard</text><text x="65" y="225">Users</text><text x="65" y="275">Songs</text><text x="65" y="325">Subscriptions</text><text x="65" y="375">Devices</text></g>
  <text x="260" y="82" fill="#fff" font-family="Arial" font-size="28" font-weight="700">March Mandalar Control Center</text>
  <g><rect x="260" y="115" width="175" height="100" rx="16" fill="#142238"/><rect x="455" y="115" width="175" height="100" rx="16" fill="#142238"/><rect x="650" y="115" width="175" height="100" rx="16" fill="#142238"/></g>
  <g fill="#8fa5c3" font-family="Arial" font-size="15"><text x="280" y="145">TOTAL USERS</text><text x="475" y="145">ACTIVE SONGS</text><text x="670" y="145">SUBSCRIPTIONS</text></g>
  <g fill="#fff" font-family="Arial" font-size="34" font-weight="700"><text x="280" y="190">128</text><text x="475" y="190">240</text><text x="670" y="190">94</text></g>
  <rect x="260" y="245" width="565" height="235" rx="18" fill="#111e31"/>
  <g fill="#6f86a7"><rect x="285" y="278" width="515" height="14" rx="7"/><rect x="285" y="323" width="455" height="14" rx="7"/><rect x="285" y="368" width="490" height="14" rx="7"/><rect x="285" y="413" width="410" height="14" rx="7"/></g>
  <g fill="#1db954"><circle cx="300" cy="285" r="7"/><circle cx="300" cy="330" r="7"/><circle cx="300" cy="375" r="7"/><circle cx="300" cy="420" r="7"/></g>
