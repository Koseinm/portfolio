<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Developer Blog Project Illustration</title>
  <desc id="desc">A modern dark developer blog preview with article cards, code symbols, and glowing accents.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1830"/>
      <stop offset="100%" stop-color="#101a34"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17233f"/>
      <stop offset="100%" stop-color="#0e1730"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7f9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="125" y="108" width="950" height="544" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <circle cx="155" cy="120" r="120" fill="#22d3ee" opacity=".13" filter="url(#glow)"/>
  <circle cx="1040" cy="630" r="150" fill="#8b5cf6" opacity=".16" filter="url(#glow)"/>
  <circle cx="980" cy="92" r="75" fill="#60a5fa" opacity=".10" filter="url(#glow)"/>

  <g opacity=".24">
    <path d="M0 640 C230 530 410 730 640 620 S970 520 1200 625" fill="none" stroke="#334a78" stroke-width="2"/>
    <path d="M0 684 C240 570 450 760 680 652 S1010 565 1200 665" fill="none" stroke="#334a78" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="95" y="78" width="1010" height="604" rx="38" fill="#08101e" stroke="#263858" stroke-width="2"/>
    <rect x="125" y="108" width="950" height="544" rx="28" fill="url(#panel)"/>
  </g>

  <g clip-path="url(#screenClip)">
    <rect x="125" y="108" width="950" height="68" fill="#0b1426"/>
    <circle cx="164" cy="142" r="7" fill="#fb7185"/>
    <circle cx="188" cy="142" r="7" fill="#fbbf24"/>
    <circle cx="212" cy="142" r="7" fill="#34d399"/>
    <rect x="250" y="126" width="325" height="32" rx="16" fill="#111f38"/>
    <circle cx="272" cy="142" r="6" fill="none" stroke="#6f83a7" stroke-width="2"/>
    <path d="M277 147l8 8" stroke="#6f83a7" stroke-width="2" stroke-linecap="round"/>
    <text x="300" y="148" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#7f92b5">seinmin.dev/blog</text>

    <g transform="translate(164 205)">
      <rect width="872" height="86" rx="20" fill="#111d34" stroke="#263958"/>
      <rect x="24" y="22" width="42" height="42" rx="12" fill="url(#accent)"/>
      <path d="M38 34h14M38 42h14M38 50h9" stroke="#07111f" stroke-width="3" stroke-linecap="round"/>
      <text x="84" y="39" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#edf5ff">SEIN MIN DEV BLOG</text>
      <text x="84" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8fa3c4">React Native • PHP • APIs • Development Notes</text>
      <rect x="675" y="24" width="82" height="36" rx="18" fill="#152744"/>
      <text x="699" y="47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#9bb4dc">Posts</text>
      <rect x="767" y="24" width="81" height="36" rx="18" fill="url(#accent)"/>
      <text x="790" y="47" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#06101d">About</text>
    </g>

    <g transform="translate(164 318)">
      <rect width="540" height="280" rx="24" fill="#101d34" stroke="#2b4165"/>
      <rect x="20" y="20" width="500" height="126" rx="18" fill="#0a1427"/>
      <circle cx="454" cy="54" r="54" fill="#8b5cf6" opacity=".14" filter="url(#glow)"/>
      <text x="44" y="62" font-family="Consolas,Monaco,monospace" font-size="25" font-weight="700" fill="#6ee7f9">&lt;/&gt;</text>
      <text x="44" y="96" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f2f6ff">Build Better Mobile Apps</text>
      <text x="44" y="121" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#93a8c9">Practical React Native architecture and API integration.</text>

      <rect x="22" y="166" width="92" height="26" rx="13" fill="#162b49"/>
      <text x="42" y="184" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#76dff2">FEATURED</text>
      <text x="22" y="222" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#edf4ff">March Mandalar Development Log</text>
      <text x="22" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8ea2c2">Streaming, offline playback, downloads and PHP/MySQL.</text>
      <path d="M22 265h250" stroke="url(#accent2)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g transform="translate(728 318)">
      <rect width="308" height="128" rx="22" fill="#101d34" stroke="#2b4165"/>
      <rect x="18" y="18" width="64" height="64" rx="16" fill="#142842"/>
      <text x="34" y="58" font-family="Consolas,Monaco,monospace" font-size="22" font-weight="700" fill="#a78bfa">{ }</text>
      <text x="98" y="43" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#7c91b5">PHP &amp; API</text>
      <text x="98" y="67" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#eef4ff">Secure REST APIs</text>
      <text x="98" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#8ea2c2">Auth, uploads and IIS hosting.</text>
      <circle cx="282" cy="103" r="10" fill="#22d3ee" opacity=".75"/>
    </g>

    <g transform="translate(728 470)">
      <rect width="308" height="128" rx="22" fill="#101d34" stroke="#2b4165"/>
      <rect x="18" y="18" width="64" height="64" rx="16" fill="#142842"/>
      <path d="M36 37h28v24H36zM42 31v36M58 31v36" fill="none" stroke="#6ee7f9" stroke-width="3" stroke-linejoin="round"/>
      <text x="98" y="43" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#7c91b5">DEV NOTES</text>
      <text x="98" y="67" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#eef4ff">Tutorials &amp; Guides</text>
      <text x="98" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#8ea2c2">Clear steps from setup to release.</text>
      <circle cx="282" cy="103" r="10" fill="#8b5cf6" opacity=".8"/>
    </g>
  </g>

  <g transform="translate(480 704)">
    <rect width="240" height="8" rx="4" fill="#243653"/>
    <rect x="70" width="100" height="8" rx="4" fill="url(#accent2)"/>
  </g>
</svg>
